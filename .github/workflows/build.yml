name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project DeltaCraft.xcodeproj \
            -target DeltaCraft \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" \
            build

      - name: Ad-hoc sign
        run: codesign --force --sign - "build/Release-iphoneos/DeltaCraft.app"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/DeltaCraft.app Payload/
          zip -r DeltaCraft.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeltaCraft-ipa
          path: DeltaCraft.ipa
